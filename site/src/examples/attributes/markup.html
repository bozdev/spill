<div class="carousel carousel--attributes">
  <section id="attributes-demo" aria-label="Numbers"
    data-spill-carousel='{"align":"start"}'
    data-spill-plugins="autoplay"
    data-spill-autoplay='{"delay":3000,"playOnInit":false}'>
    <div class="carousel__viewport" data-spill-viewport>
      <div class="carousel__container">
        <div class="carousel__slide"><div class="carousel__card">1</div></div>
        <div class="carousel__slide"><div class="carousel__card">2</div></div>
        <div class="carousel__slide"><div class="carousel__card">3</div></div>
        <div class="carousel__slide"><div class="carousel__card">4</div></div>
        <div class="carousel__slide"><div class="carousel__card">5</div></div>
        <div class="carousel__slide"><div class="carousel__card">6</div></div>
      </div>
    </div>
    <div class="carousel__progress" data-spill-progress aria-hidden="true"></div>
    <div class="carousel__controls">
      <div class="carousel__buttons">
        <button class="carousel__button" type="button" aria-label="Previous slide" data-spill-prev>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <button class="carousel__button" type="button" aria-label="Next slide" data-spill-next>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </button>
        <button class="carousel__button carousel__button--play" type="button" aria-label="Autoplay" data-spill-play>
          <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5Z" /></svg>
          <svg class="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
        </button>
      </div>
      <div class="carousel__dots" data-spill-dots="number"></div>
    </div>
  </section>
  <div class="carousel__elsewhere">
    <span>Outside the carousel</span>
    <button class="carousel__remote" type="button" data-spill-next data-spill-for="attributes-demo">
      Next slide
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
    </button>
  </div>
</div>
